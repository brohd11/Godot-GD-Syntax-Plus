export_root: "res://addons/syntax_plus/export_ignore/exports"
exports:
  -
    exclude:
      directories:
        - "res://addons/syntax_plus/export_ignore"
      file_extensions: []
      files: []
    export_name: "syntax-plus{{version=syntax_plus}}"
    export_folder: "addons/syntax_plus"
    other_transfers: []
    source: "res://addons/syntax_plus/"
    remote_dir: "res://addons/syntax_plus/src/remote/"
options:
  use_tag_in_cfg: true
  exported_deps: ["brohd11/godot-gdscript-lsp@v0.1.0"]
  include_min_version: true
  include_import: true
  include_uid: true
  overwrite: true
  parser_settings:
    parse_cs:
      namespace_rename: {}
    parse_gd:
      reduce_access_paths: true
      optimizer:
        enabled: true
        structs: true
        inline_functions: true
        scalar_replacement: true
        struct_read_types: typed_locals
        scalar_replacement_allow_ref_counted: false
        struct_read_types_allow_ref_counted: false
        inline_functions_allow_ref_counted: false
        inline_functions_allow_variants: false
    parse_tscn: {}
plugin_folder: "SyntaxPlus{{version=syntax_plus}}"
post_script: "res://addons/syntax_plus/export_ignore/pre_post_export.gd"
pre_script: "res://addons/syntax_plus/export_ignore/pre_post_export.gd"
